<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Facet Gradients -->
    <linearGradient id="cr-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B72" />
      <stop offset="100%" stop-color="#FF8A3D" />
    </linearGradient>
    <linearGradient id="cr-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="cr-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="cr-shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#cr-shadow)">
    <!-- Top Face (Warm Coral / Orange) -->
    <path
      d="M16 3.6 L26.4 9.6 C26.9 9.9 26.9 10.5 26.4 10.8 L16.4 16.5 C16.1 16.7 15.9 16.7 15.6 16.5 L5.6 10.8 C5.1 10.5 5.1 9.9 5.6 9.6 L15.6 3.6 C15.8 3.5 16.2 3.5 16 3.6 Z"
      fill="url(#cr-top)"
      stroke="rgba(0, 0, 0, 0.12)"
      stroke-width="0.6"
      stroke-linejoin="round"
    />

    <!-- Left Face (Deep Violet / Indigo) -->
    <path
      d="M5.3 11.2 L15.3 16.9 C15.7 17.1 16 17.5 16 18.0 L16 27.1 C16 27.7 15.4 28.1 14.9 27.8 L4.9 22.1 C4.5 21.9 4.3 21.5 4.3 21.0 L4.3 12.1 C4.3 11.5 4.9 11.0 5.3 11.2 Z"
      fill="url(#cr-left)"
      stroke="rgba(0, 0, 0, 0.15)"
      stroke-width="0.6"
      stroke-linejoin="round"
    />

    <!-- Right Face (Emerald / Teal) -->
    <path
      d="M26.7 11.2 L16.7 16.9 C16.3 17.1 16 17.5 16 18.0 L16 27.1 C16 27.7 16.6 28.1 17.1 27.8 L27.1 22.1 C27.5 21.9 27.7 21.5 27.7 21.0 L27.7 12.1 C27.7 11.5 27.1 11.0 26.7 11.2 Z"
      fill="url(#cr-right)"
      stroke="rgba(0, 0, 0, 0.15)"
      stroke-width="0.6"
      stroke-linejoin="round"
    />
  </g>

  <!-- Specular highlight facet lines -->
  <path d="M16 4 L16 16.5" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.6" stroke-linecap="round" />
  <path d="M5.8 10.2 L16 16.5 L26.2 10.2" stroke="rgba(255, 255, 255, 0.2)" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dice Pips -->
  <!-- Top Face (3 pips) -->
  <circle cx="12" cy="8.2" r="1.15" fill="#FFFFFF" fill-opacity="0.95" />
  <circle cx="16" cy="10.5" r="1.3" fill="#FFFFFF" fill-opacity="0.98" />
  <circle cx="20" cy="12.8" r="1.15" fill="#FFFFFF" fill-opacity="0.95" />

  <!-- Left Face (2 pips) -->
  <circle cx="8.8" cy="16.6" r="1.15" fill="#FFFFFF" fill-opacity="0.95" />
  <circle cx="12.5" cy="22.2" r="1.15" fill="#FFFFFF" fill-opacity="0.95" />

  <!-- Right Face (4 pips) -->
  <circle cx="19.2" cy="16.5" r="1.1" fill="#FFFFFF" fill-opacity="0.95" />
  <circle cx="23.8" cy="14.3" r="1.1" fill="#FFFFFF" fill-opacity="0.95" />
  <circle cx="19.2" cy="22.3" r="1.1" fill="#FFFFFF" fill-opacity="0.95" />
  <circle cx="23.8" cy="20.1" r="1.1" fill="#FFFFFF" fill-opacity="0.95" />
</svg>
